name: 'Setup asimov-bayeswave Environment'
description: 'Install asimov-bayeswave (and its asimov + BayesWave dependencies) with conda'
inputs:
  python-version:
    description: 'Python version to use'
    default: '3.11'
    required: false
  conda-packages:
    description: 'Path to conda packages file; set to empty string to skip heavy conda packages'
    default: 'conda/packages.txt'
    required: false
runs:
  using: "composite"
  steps:
    - name: Cache conda packages and pip
      uses: actions/cache@v4
      with:
        path: |
          /usr/share/miniconda/pkgs
          ~/.cache/pip
        key: conda-${{ runner.os }}-${{ hashFiles('conda/packages.txt', 'pyproject.toml') }}
        restore-keys: |
          conda-${{ runner.os }}-

    - name: Set up conda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        auto-activate-base: false
        python-version: ${{ inputs.python-version }}
        activate-environment: asimov
        channels: conda-forge
        use-mamba: true

    - name: Cache asimov-bayeswave conda env
      id: cache-env
      uses: actions/cache@v4
      with:
        path: /usr/share/miniconda/envs/asimov
        key: conda-env-asimov-bayeswave-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('conda/packages.txt', 'pyproject.toml') }}
        restore-keys: |
          conda-env-asimov-bayeswave-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Install conda dependencies (BayesWave)
      # BayesWave (the sampler itself) and bayeswave_pipe/megaplot.py/
      # megasky.py (the DAG-generation and plotting layer) are two
      # separate conda-forge packages -- `bayeswave` only ships the C
      # executables (BayesWave, BayesWavePost, ...); `bayeswave_pipe` and
      # friends come from `bayeswaveutils`, which is a plain Python package
      # with no PyPI wheel. Neither needs a numpy<2 pin the way
      # asimov-lalinference's conda-forge::lalinference build does --
      # bayeswaveutils' bundled megaplot.py has already been patched
      # upstream for numpy 2.0 (see the feedstock's
      # 0002-Update-megaplot-to-be-happy-with-numpy-2.0.patch), confirmed
      # by running the full bayeswave_pipe -> BayesWave -> BayesWavePost ->
      # megaplot.py chain for real against numpy 2.3.5 while developing
      # this test.
      if: steps.cache-env.outputs.cache-hit != 'true' && inputs.conda-packages != ''
      shell: bash -el {0}
      run: |
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        conda install -y -n asimov --file ${{ inputs.conda-packages }}

    - name: Install asimov-bayeswave from source
      shell: bash -e {0}
      run: |
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        CONDA_BASE="$("${CONDA_EXE:-conda}" info --base)"
        CONDA_PYTHON="${CONDA_BASE}/envs/asimov/bin/python"
        "$CONDA_PYTHON" -m ensurepip --upgrade
        # htcondor is pulled in transitively via asimov. The 25.14.x Python
        # bindings fail to authenticate to htcondor/mini's schedd (every
        # method, including FS, is rejected with AUTHENTICATE:1003), so
        # asimov's Schedd().submit() never reaches the queue. 25.13.2 works
        # against the same image. Pin until the bindings are fixed.
        "$CONDA_PYTHON" -m pip install --force-reinstall -e ".[test]" "htcondor<25.14"
        # bayeswaveutils' megaplot.py does `import pkg_resources` (from
        # setuptools) at module load time. bayeswaveutils' own conda-forge
        # recipe declares a `setuptools<82` dependency for exactly this
        # reason: setuptools has been dropping the deprecated pkg_resources
        # module in recent releases. ensurepip's bootstrapped pip (invoked
        # above) no longer bundles setuptools by default, so an earlier fix
        # here added a bare `pip install setuptools` -- but confirmed by a
        # second real e2e run, that resolves to whatever is latest
        # (observed: 84.0.0), which no longer ships pkg_resources at all,
        # so megaplot.py failed with the exact same
        # "ModuleNotFoundError: No module named 'pkg_resources'" anyway.
        # Pin to the same ceiling bayeswaveutils' own recipe uses.
        "$CONDA_PYTHON" -m pip install "setuptools<82"
        # Regular (non-editable) installs set explicit, world-readable
        # permissions from the wheel's RECORD; an editable install's
        # metadata (entry_points.txt etc.) is instead written fresh by pip
        # subject to the current process umask. This step runs as root, and
        # under a restrictive root umask the resulting dist-info can end up
        # unreadable by `submituser` -- which silently drops this package's
        # `asimov.pipelines` entry point (asimov's own plugin loader catches
        # and swallows the failure) rather than erroring here. Force
        # everything world-readable so submituser can always see it.
        chmod -R a+rX "$CONDA_BASE/envs/asimov"
        echo "Installed asimov-bayeswave from: $("$CONDA_PYTHON" -c 'import asimov_bayeswave; print(asimov_bayeswave.__file__)')"
        echo "Installed asimov from: $("$CONDA_PYTHON" -c 'import asimov; print(asimov.__file__)')"
        echo "Installed bayeswave_pipe at: $("$CONDA_PYTHON" -c 'import shutil; print(shutil.which("bayeswave_pipe"))')"
        echo "Installed BayesWave at: $("$CONDA_PYTHON" -c 'import shutil; print(shutil.which("BayesWave"))')"
